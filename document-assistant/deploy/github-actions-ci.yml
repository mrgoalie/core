# Optional continuous-integration workflow for the Document Assistant.
# To use it, copy this file to .github/workflows/document-assistant-ci.yml in the repository.
name: Document Assistant CI
on:
  push:
    paths: ["document-assistant/**"]
  pull_request:
    paths: ["document-assistant/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: document-assistant/package-lock.json
      - name: Install LibreOffice (faithful Word → PDF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: document-assistant/playwright-report
